name: sto-postgres

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sto
      POSTGRES_PASSWORD: sto
      POSTGRES_DB: sto
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sto -d sto"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  data:
