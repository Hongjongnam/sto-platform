name: sto-besu

x-besu: &besu
  image: hyperledger/besu:26.9.0
  restart: unless-stopped
  environment:
    BESU_OPTS: "-Xms256m -Xmx768m"
  entrypoint:
    - besu
    - --genesis-file=/config/genesis.json
    - --node-private-key-file=/node/key
    - --static-nodes-file=/config/static-nodes.json
    - --data-path=/data
    - --discovery-enabled=false
    - --min-gas-price=0
    - --rpc-http-enabled
    - --rpc-http-host=0.0.0.0
    - --rpc-http-api=ETH,NET,WEB3,QBFT,TXPOOL
    - --host-allowlist=*
    - --permissions-accounts-config-file-enabled
    - --permissions-accounts-config-file=/node/permissions_config.toml
    - --logging=INFO

services:
  node1:
    <<: *besu
    ports:
      - "127.0.0.1:8545:8545"
    volumes:
      - ./network/genesis.json:/config/genesis.json:ro
      - ./network/static-nodes.json:/config/static-nodes.json:ro
      - ./network/node1:/node
      - node1:/data
    networks:
      besu:
        ipv4_address: 172.28.0.11
  node2:
    <<: *besu
    volumes:
      - ./network/genesis.json:/config/genesis.json:ro
      - ./network/static-nodes.json:/config/static-nodes.json:ro
      - ./network/node2:/node
      - node2:/data
    networks:
      besu:
        ipv4_address: 172.28.0.12
  node3:
    <<: *besu
    volumes:
      - ./network/genesis.json:/config/genesis.json:ro
      - ./network/static-nodes.json:/config/static-nodes.json:ro
      - ./network/node3:/node
      - node3:/data
    networks:
      besu:
        ipv4_address: 172.28.0.13
  node4:
    <<: *besu
    volumes:
      - ./network/genesis.json:/config/genesis.json:ro
      - ./network/static-nodes.json:/config/static-nodes.json:ro
      - ./network/node4:/node
      - node4:/data
    networks:
      besu:
        ipv4_address: 172.28.0.14

volumes:
  node1:
  node2:
  node3:
  node4:

networks:
  besu:
    ipam:
      config:
        - subnet: 172.28.0.0/24
