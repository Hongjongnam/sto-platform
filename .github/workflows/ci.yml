name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      # Size is measured before coverage: the coverage run leaves instrumented artifacts behind.
      - run: node scripts/check-size.ts
      - run: npm run coverage

  slither:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install slither-analyzer==0.11.6
      - run: slither . --fail-medium

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sto
          POSTGRES_PASSWORD: sto
          POSTGRES_DB: sto
        ports:
          - 54320:5432
        options: >-
          --health-cmd "pg_isready -U sto -d sto"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            backend/package-lock.json
      # The integration tests start a local chain and deploy the contracts to it.
      - run: npm ci
        working-directory: contracts
      - run: npm run build
        working-directory: contracts
      - run: npm ci
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm run test:e2e
        working-directory: backend
